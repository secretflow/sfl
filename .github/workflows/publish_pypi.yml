name: "Publish PyPI Package"
on:
  workflow_dispatch:

jobs:
  trigger-circleci:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: secretflow-deploy
        id: secretflow-deploy
        uses: CircleCI-Public/trigger-circleci-pipeline-action@ef1944e67053c1923ad772d2377575f2fd962169 # v1.0.5
        with:
          GHA_Meta: "publish_pypi"
        env:
          CCI_TOKEN: ${{ secrets.CCI_TOKEN }}
